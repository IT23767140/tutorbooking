<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TutorConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1120; color: #E0E0E0; }
        .btn-primary { background-color: #2563EB; color: white; padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: 500; transition: background-color 0.3s; display: inline-block; text-align: center; }
        .btn-primary:hover { background-color: #1D4ED8; }
        .card { background-color: #1E293B; border-radius: 0.5rem; padding: 2rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); }
        .input-field { background-color: #2C3A4F; border: 1px solid #3B4B60; color: #E0E0E0; padding: 0.75rem 1rem; border-radius: 0.375rem; width: 100%; transition: border-color 0.3s; }
        .input-field:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 2px rgba(37,99,235,0.5); }
        .nav-link { transition: color 0.3s; }
        .nav-link:hover { color: #60A5FA; }
        .error-message { color: #F87171; font-size: 0.875rem; margin-top: 0.25rem; text-align: left; }
    </style>
</head>
<body class="antialiased">

<nav class="bg-slate-900/80 backdrop-blur-md text-white p-4 sticky top-0 z-50 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
        <a href="/index.html" class="text-2xl font-bold">Tutor<span class="text-blue-500">Connect</span></a>
        <div class="space-x-3 sm:space-x-4 flex items-center">
            <a href="/index.html" class="nav-link text-sm sm:text-base">Home</a>
            <a href="/tutors.html" class="nav-link text-sm sm:text-base">Our Tutors</a>
            <a id="navLoginLink" href="/login.html" class="nav-link text-sm sm:text-base">Login</a>
            <a id="navRegisterLink" href="/register.html" class="btn-primary text-xs sm:text-sm px-3 py-2 sm:px-4 sm:py-2.5 font-semibold text-blue-400">Join Today</a>
            <a id="navProfileLink" href="/user-profile.html" class="nav-link text-sm sm:text-base" style="display:none;">My Profile</a>
            <a id="navAdminDashboardLink" href="/admin-dashboard.html" class="nav-link text-sm sm:text-base" style="display:none;">Admin</a>
            <button id="navLogoutLink" style="display:none;" class="btn-secondary text-xs sm:text-sm px-3 py-1.5 sm:px-4 sm:py-2">Logout</button>
            <span id="navUserDisplay" class="ml-2 text-xs sm:text-sm"></span>
        </div>
    </div>
</nav>

<main class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 -mt-16"> <div class="max-w-md w-full space-y-8 card">
    <div>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
            Create your account
        </h2>
    </div>
    <form id="registrationForm" class="mt-8 space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-300 mb-1">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required class="input-field" placeholder="Choose a username">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required class="input-field" placeholder="you@example.com">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required class="input-field" placeholder="Create a password (min. 6 characters)">
        </div>
        <div>
            <label for="contactNumber" class="block text-sm font-medium text-gray-300 mb-1">Contact Number (Optional)</label>
            <input id="contactNumber" name="contactNumber" type="tel" class="input-field" placeholder="Your phone number">
        </div>
        <div id="errorMessage" class="error-message"></div>

        <div>
            <button type="submit" class="btn-primary w-full py-3 text-base">
                Register
            </button>
        </div>
    </form>
    <p class="mt-4 text-center text-sm text-gray-400">
        Already have an account?
        <a href="/login.html" class="font-medium text-blue-400 hover:text-blue-300">
            Login here
        </a>
    </p>
</div>
</main>

<div id="globalErrorDisplay" style="display:none;"></div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof updateNavOnLoginForNav === 'function') {
            updateNavOnLoginForNav();
        }
    });
</script>
</body>
</html>
