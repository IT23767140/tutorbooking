<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Review - TutorConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1120; color: #E0E0E0; }
        .btn-primary { background-color: #2563EB; color: white; padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: 500; transition: background-color 0.3s; display: inline-block; text-align: center; }
        .btn-primary:hover { background-color: #1D4ED8; }
        .card { background-color: #1E293B; border-radius: 0.5rem; padding: 2rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); }
        .input-field { background-color: #2C3A4F; border: 1px solid #3B4B60; color: #E0E0E0; padding: 0.75rem 1rem; border-radius: 0.375rem; width: 100%; transition: border-color 0.3s; }
        .input-field:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 2px rgba(37,99,235,0.5); }
        .nav-link { transition: color 0.3s, background-color 0.3s; }
        .nav-link:hover { color: #93C5FD; background-color: rgba(59, 130, 246, 0.1); }
        .error-message { color: #F87171; font-size: 0.875rem; margin-top: 0.25rem; text-align: left; }
        .star-rating-input { display: flex; justify-content: center; margin-bottom: 1rem; }
        .star-rating-input .star { font-size: 2.5rem; color: #4B5563; cursor: pointer; transition: color 0.2s; }
        .star-rating-input .star:hover,
        .star-rating-input .star.selected { color: #FBBF24; }
        /* Dropdown styles */
        .dropdown-menu {
          display: none;
          transition: opacity 0.2s ease-out, transform 0.2s ease-out;
          opacity: 0;
          transform: translateY(-10px);
        }
        .dropdown-menu.open {
          display: block;
          opacity: 1;
          transform: translateY(0);
        }
    </style>
</head>
<body class="antialiased">

<nav class="bg-slate-900/70 backdrop-blur-md text-white p-4 sticky top-0 z-50 shadow-xl border-b border-slate-700/50">
    <div class="container mx-auto flex justify-between items-center">
        <a href="/index.html" class="text-xl sm:text-2xl font-bold tracking-tight">Tutor<span class="text-blue-500">Connect</span></a>
        <div class="flex items-center space-x-2 sm:space-x-3 md:space-x-4">
            <a href="/index.html" class="nav-link text-xs sm:text-sm md:text-base px-2 py-1.5 rounded-md">Home</a>
            <a href="/tutors.html" class="nav-link text-xs sm:text-sm md:text-base px-2 py-1.5 rounded-md">Our Tutors</a>
            <div id="authLinksContainer" class="flex items-center space-x-2 sm:space-x-3 md:space-x-4">
                <a id="navLoginLink" href="/login.html" class="nav-link text-xs sm:text-sm md:text-base px-2 py-1.5 rounded-md">Login</a>
                <a id="navRegisterLink" href="/register.html" class="btn-primary text-xs sm:text-sm px-3 py-2 sm:px-4 sm:py-[0.6rem]">Join Today</a>
            </div>
            <div id="userAvatarDropdownContainer" class="relative ml-2 sm:ml-3" style="display: none;">
                <button id="userAvatarButton" class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 bg-blue-600 rounded-full text-white text-base sm:text-lg font-semibold focus:outline-none ring-2 ring-transparent hover:ring-blue-400 focus:ring-blue-400 transition"></button>
                <div id="userDropdownMenu" class="dropdown-menu absolute right-0 mt-2 w-56 bg-slate-800 rounded-md shadow-2xl py-1 z-[60] border border-slate-700">
                    <div class="px-4 py-3 border-b border-slate-700">
                        <p class="text-sm text-white font-semibold" id="dropdownUsername">Username</p>
                        <p class="text-xs text-slate-400" id="dropdownUserRole">Role</p>
                    </div>
                    <a href="/user-profile.html" class="block px-4 py-2 text-sm text-gray-300 hover:bg-slate-700 hover:text-white">My Profile</a>
                    <a href="/my-bookings.html" class="block px-4 py-2 text-sm text-gray-300 hover:bg-slate-700 hover:text-white">My Bookings</a>
                    <a href="/payment-history.html" class="block px-4 py-2 text-sm text-gray-300 hover:bg-slate-700 hover:text-white">Payment History</a>
                    <a id="navAdminDashboardLink" href="/admin-dashboard.html" class="block px-4 py-2 text-sm text-gray-300 hover:bg-slate-700 hover:text-white" style="display:none;">Admin Dashboard</a>
                    <hr class="border-slate-700 my-1">
                    <button id="navDropdownLogoutLink" class="w-full text-left block px-4 py-2 text-sm text-red-400 hover:bg-slate-700 hover:text-red-300">Logout</button>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="container mx-auto py-12 px-4">
    <div class="max-w-lg mx-auto card">
        <h1 class="text-3xl font-bold text-white mb-2 text-center">Edit Your Review</h1>
        <p class="text-center text-gray-400 mb-8">for <strong id="tutorNameForEditReview" class="text-blue-400">Loading tutor...</strong></p>
        <form id="editReviewForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2 text-center">Your Rating</label>
                <div id="editStarRatingContainer" class="star-rating-input" data-rating-input-id="editRatingValue">
                    <span class="star" data-value="1">☆</span><span class="star" data-value="2">☆</span><span class="star" data-value="3">☆</span><span class="star" data-value="4">☆</span><span class="star" data-value="5">☆</span>
                </div>
                <input type="hidden" id="editRatingValue" name="rating" required>
            </div>
            <div>
                <label for="editComment" class="block text-sm font-medium text-gray-300 mb-1">Your Comment</label>
                <textarea id="editComment" name="comment" rows="4" required class="input-field" placeholder="Share your updated experience..."></textarea>
            </div>
            <div id="errorMessage" class="error-message"></div>
            <div><button type="submit" class="btn-primary w-full py-2.5 text-base">Update Review</button></div>
        </form>
    </div>
</main>

<footer class="bg-slate-950 text-gray-400 py-8 text-center mt-12"><div class="container mx-auto"><p>&copy; <span id="currentYear"></span> TutorConnect. All rights reserved.</p></div></footer>
<div id="globalErrorDisplay" class="fixed bottom-4 right-4 bg-red-600 text-white p-4 rounded-lg shadow-xl z-[100] text-sm" style="display:none; opacity: 0; transition: opacity 0.5s ease-out;"></div>

<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/review.js"></script>
<script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof updateNavOnLoginGlobal === 'function') {
            updateNavOnLoginGlobal();
        }
    });
</script>
</body>
</html>
